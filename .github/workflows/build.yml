name: Build Folktails+ Addons
on:
  push:
    branches: [main]
    paths:
      - 'Runtime/**'
      - 'Mod/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Import TB Optimizer's reference-only build stubs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse --branch TB-Optimizer https://github.com/tharbad08/TimberbornMods.git "$RUNNER_TEMP/reference"
          git -C "$RUNNER_TEMP/reference" sparse-checkout set BenchmarkAndOptimizerV11Port/Stubs
          cp -a "$RUNNER_TEMP/reference/BenchmarkAndOptimizerV11Port/Stubs" Runtime/Stubs
      - name: Compile actual release DLL
        run: dotnet build Runtime/FolktailsPlusAddons.csproj --configuration Release
      - name: Package exactly one Timberborn mod folder
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/package/FolktailsPlusAddons"
          mkdir -p "$ROOT/version-1.1/Scripts"
          cp Mod/manifest.json "$ROOT/version-1.1/manifest.json"
          cp -a Mod/Payload "$ROOT/Payload"
          cp Runtime/bin/Release/netstandard2.1/FolktailsPlusAddons.dll "$ROOT/version-1.1/Scripts/"
          test -s "$ROOT/version-1.1/Scripts/FolktailsPlusAddons.dll"
          test "$(find "$ROOT" -name manifest.json | wc -l)" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path(__import__('os').environ['RUNNER_TEMP'])/'package'/'FolktailsPlusAddons'
          assert len(list(root.rglob('manifest.json')))==1
          assert len(list(root.rglob('*.dll')))==1
          assert len(list(root.rglob('*.template')))==10
          for p in root.rglob('*.template'): json.loads(p.read_text())
          print("PASS: one mod ID; one DLL; 10 feature blueprints")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FolktailsPlusAddons_1.1.3
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
