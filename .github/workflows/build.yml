name: Build Folktails+ Addons
on:
  push:
    branches: [main]
    paths:
      - 'Runtime/**'
      - 'Mod/**'
      - 'README.md'
      - 'WorkshopCover.png'
      - 'WorkshopPreview.jpg'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Import TB Optimizer reference-only build stubs
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --filter=blob:none --sparse --branch TB-Optimizer https://github.com/tharbad08/TimberbornMods.git "$RUNNER_TEMP/reference"
          git -C "$RUNNER_TEMP/reference" sparse-checkout set BenchmarkAndOptimizerV11Port/Stubs
          mkdir -p Runtime/Stubs
          cp -a "$RUNNER_TEMP/reference/BenchmarkAndOptimizerV11Port/Stubs/." Runtime/Stubs/
          git restore -- Runtime/Stubs/Timberborn.Modding/Stub.cs Runtime/Stubs/Timberborn.SettingsSystem/Stub.cs Runtime/Stubs/ModSettings.Core/Stub.cs
      - name: Check Timberborn 1.1 blueprint API contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          stub=Path('Runtime/Stubs/Timberborn.BlueprintSystem/Stub.cs').read_text()
          assert 'BlueprintFileBundle? GetBundle(string path)' in stub
          assert 'object? GetBundle(string path)' not in stub
          assert 'public sealed class BlueprintFileBundle' in stub
          runtime=Path('Runtime/AddonRuntime.cs').read_text()
          assert '_bundles.GetBundle(' in runtime
          print('PASS: BlueprintFileBundleLoader.GetBundle returns BlueprintFileBundle, not object')
          PY
      - name: Compile release DLL
        run: dotnet build Runtime/FolktailsPlusAddons.csproj --configuration Release
      - name: Package one Timberborn mod folder and verify
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/package/FolktailsPlusAddons"
          mkdir -p "$ROOT/version-1.1/Scripts"
          cp Mod/manifest.json "$ROOT/version-1.1/manifest.json"
          cp -a Mod/Static/version-1.1/. "$ROOT/version-1.1/"
          cp Mod/ModDesc.txt "$ROOT/ModDesc.txt"
          cp README.md "$ROOT/README.md"
          cp WorkshopCover.png "$ROOT/WorkshopCover.png"
          cp WorkshopPreview.jpg "$ROOT/WorkshopPreview.jpg"
          cp Runtime/bin/Release/netstandard2.1/FolktailsPlusAddons.dll "$ROOT/version-1.1/Scripts/"
          test -s "$ROOT/version-1.1/Scripts/FolktailsPlusAddons.dll"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'package'/'FolktailsPlusAddons'
          assert root.is_dir()
          assert len(list(root.rglob('manifest.json')))==1, 'Must be one manifest'
          assert len(list(root.rglob('*.dll')))==1, 'Must be one DLL'
          assert (root/'README.md').stat().st_size>1000
          assert (root/'ModDesc.txt').stat().st_size>200
          import struct
          png=(root/'WorkshopCover.png').read_bytes()
          jpg=(root/'WorkshopPreview.jpg').read_bytes()
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II',png[16:24])==(1254,1254)
          assert jpg[:3]==b'\xff\xd8\xff' and jpg[-2:]==b'\xff\xd9'
          assert len(jpg)>30000
          m=json.loads((root/'version-1.1/manifest.json').read_text())
          assert m['Id']=='tharbad08.FolktailsPlusAddons'
          assert m['Version']=='1.2.4'
          assert len(m['RequiredMods'])==3
          assert len(m['OptionalMods'])==3
          templates=list((root/'Payload').rglob('*.blueprint.json.template'))
          assert len(templates)==0, len(templates)
          counts={feature:len(list(pathlib.Path('Mod/Payload',feature).rglob('*.template'))) for feature in ('ChargingBoost','TinyTubeway','ScientificProjects','MixerCosts')}
          assert counts=={'ChargingBoost':2,'TinyTubeway':1,'ScientificProjects':5,'MixerCosts':4},counts
          for template in pathlib.Path('Mod/Payload').rglob('*.template'): json.loads(template.read_text())
          expected={
             'DeepWaterPump':(100,[('Log',24)]),
             'DeepBadwaterPump':(500,[('Log',40),('Gear',20),('MetalPart',20)]),
             'DeepMechanicalFluidPump':(5000,[('Gear',100),('TreatedPlank',50),('MetalBlock',50)]),
             'IndustrialLumberMill':(200,[('Log',40)]),
          }
          for name,(science,materials) in expected.items():
              p=next(p for p in pathlib.Path('Mod/Payload/MixerCosts').rglob('*.template') if p.name==name+'.IronTeeth.blueprint.json.template')
              data=json.loads(p.read_text())['BuildingSpec']
              assert set(data)=={'BuildingCost','ScienceCost'},name
              assert data['ScienceCost']==science
              assert [(x['Id'],x['Amount']) for x in data['BuildingCost']]==materials
          runtime=pathlib.Path('Runtime/AddonRuntime.cs').read_text()
          assert 'new Feature("MixerCosts"' in runtime
          assert 'IBlueprintModifierProvider' in runtime and 'File.WriteAll' not in runtime and 'new Harmony(' not in runtime
          # The old full collection must never return: use native array diffs instead.
          assert len(list(root.rglob('*.blueprint.json')))==2
          assert not (root/'version-1.1/NeedCollections/NeedCollection.FolktailsPlus.blueprint.json').exists()
          assert not (root/'version-1.1/Factions/Faction.Folktails.blueprint.json').exists()
          scoped_path=root/'version-1.1/Modifiers/NeedCollection.IronTeeth.FolktailsPlusAddons.blueprint.json'
          assert scoped_path.exists()
          assert json.loads(scoped_path.read_text())=={'NeedCollectionSpec': {'Needs#remove':['Energy'], 'Needs#append':['ChargingBoost']}}
          faction=json.loads(pathlib.Path('Mod/Payload/ChargingBoost/Factions/Faction.Folktails.blueprint.json.template').read_text())
          assert faction == {'FactionSpec': {'BlueprintModifiers#append': [
            {'Original':'needcollections/needcollection.ironteeth.blueprint',
             'Modifier':'Modifiers/NeedCollection.IronTeeth.FolktailsPlusAddons.blueprint'}]}}
          assert 'Factions/Faction.Folktails.blueprint.json' in runtime, 'The faction-scoped modifier must be enabled only with the charging boost setting'
          assert json.loads((root/'version-1.1/Needs/Need.Bot.ChargingBoost.blueprint.json').read_text())['NeedSpec']['NeedGroupId']=='Boosts'
          assert not list((root/'version-1.1/NeedCollections').glob('*.json')) if (root/'version-1.1/NeedCollections').exists() else True
          print('PASS: no global IronTeeth need change, faction-scoped Energy#remove and ChargingBoost#append')
          print('PASS: native blueprint provider, one mod folder, DLL, scoped 2-line need delta, 4 optional features')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FolktailsPlusAddons_1.2.4
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
